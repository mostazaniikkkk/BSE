plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "RedlanceMinecraft"
		url = "https://repo.redlance.org/public"
	}
	// Cobalt (Lua 5.2 VM in pure Java, the one CC: Tweaked uses): datapack spell scripts (SoulsScripts).
	maven {
		name = "SquidDev"
		url = "https://maven.squiddev.cc"
		content { includeGroup "cc.tweaked" }
	}
	// GeckoLib: models and animations of datapack enemies, from the server's resource pack (SoulsEnemy).
	maven {
		name = "GeckoLib"
		url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
		content { includeGroup "software.bernie.geckolib" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"soulsmode" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Player Animation Library: keyframed player animations with torso/elbow/knee bends.
	// Bundled inside our jar so players don't have to install it separately.
	modImplementation "com.zigythebird.playeranim:PlayerAnimationLibFabric:${project.pal_version}"
	include "com.zigythebird.playeranim:PlayerAnimationLibFabric:${project.pal_version}"

	// Lua for datapack spell scripts, bundled like PAL so players install nothing else.
	implementation "cc.tweaked:cobalt:${project.cobalt_version}"
	include "cc.tweaked:cobalt:${project.cobalt_version}"

	// GeckoLib for datapack enemy models, bundled too.
	modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
	include "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

	// Unit tests for the DS2 rules port (pure Java, no Minecraft needed)
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

// Client-side tests: code that needs Minecraft's client classes and LWJGL natives (NativeImage, textures).
sourceSets {
	clientTest {
		compileClasspath += sourceSets.client.output + sourceSets.main.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.output + sourceSets.main.output + sourceSets.client.runtimeClasspath
	}
}

dependencies {
	clientTestImplementation platform("org.junit:junit-bom:${project.junit_version}")
	clientTestImplementation "org.junit.jupiter:junit-jupiter"
	clientTestRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.register('clientTest', Test) {
	useJUnitPlatform()
	testClassesDirs = sourceSets.clientTest.output.classesDirs
	classpath = sourceSets.clientTest.runtimeClasspath
}
check.dependsOn clientTest

// The DS2-derived files are not in the repository: tools/ds2_build.py makes them from your copy of DS2 (docs/build.md).
tasks.register('checkDs2Files') {
	def marker = file('src/main/resources/data/soulsmode/ds2/weapons.json')
	doLast {
		if (!marker.exists()) {
			throw new GradleException('The DS2 files are missing. Run: python tools/ds2_build.py --game "<your DS2 Game folder>" (see docs/build.md)')
		}
	}
}

processResources {
	dependsOn 'checkDs2Files'
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}



// Copies the built mod into the local Minecraft install after every build.
def minecraftModsDir = project.findProperty("minecraft_mods_dir")
tasks.register("installMod", Copy) {
	from remapJar
	into minecraftModsDir ?: layout.buildDirectory.dir("install-skipped")
	onlyIf { minecraftModsDir != null }
}
tasks.named("build") {
	finalizedBy "installMod"
}
